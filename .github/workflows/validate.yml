name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-node-workspace.yml@1d0be2dc9d3ccb010d243a9c9d6c8dbe91efb97b
    with:
      node-version: "22"
      install-command: npm ci --ignore-scripts
      lint-command: npm run typecheck && npm run lint
      build-command: npm run build
      test-command: npx playwright install --with-deps chromium && npm test && npx playwright test

  sonar:
    name: SonarQube Cloud
    needs: ui
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - name: Verify measured LCOV is present
        run: test -s coverage/lcov.info && grep -q '^SF:packages/' coverage/lcov.info && grep -q '^DA:' coverage/lcov.info
      - name: Verify scanner credential binding
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - name: Analyze authored UI and await the quality gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          skipSignatureVerification: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
